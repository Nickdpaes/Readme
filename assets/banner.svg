<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Nicollas Dom Paes — Nick">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="380" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-500;1700" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-120;2080" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="sheen2" x1="0" y1="0" x2="240" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
      <animate attributeName="x1" values="-400;1600" dur="5s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="-160;1840" dur="5s" begin="0.35s" repeatCount="indefinite"/>
    </linearGradient>

    <mask id="maskName">
      <rect width="1200" height="300" fill="#000000"/>
      <text x="600" y="150" text-anchor="middle" fill="#ffffff"
            font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"
            font-size="62" font-weight="700" letter-spacing="1">Nicollas Dom Paes</text>
    </mask>

    <mask id="maskNick">
      <rect width="1200" height="300" fill="#000000"/>
      <text x="600" y="205" text-anchor="middle" fill="#ffffff"
            font-family="Consolas,Menlo,Monaco,Courier New,monospace"
            font-size="22" letter-spacing="8">NICK</text>
    </mask>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <g stroke="#21262d" stroke-width="1" opacity="0.55">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="120" y1="0" x2="120" y2="300"/>
    <line x1="1080" y1="0" x2="1080" y2="300"/>
  </g>

  <g fill="#8b949e" opacity="0.35">
    <circle cx="60" cy="60" r="2"/>
    <circle cx="1140" cy="60" r="2"/>
    <circle cx="60" cy="240" r="2"/>
    <circle cx="1140" cy="240" r="2"/>
  </g>

  <text x="600" y="150" text-anchor="middle" fill="#30363d"
        font-family="Segoe UI,Helvetica Neue,Helvetica,Arial,sans-serif"
        font-size="62" font-weight="700" letter-spacing="1">Nicollas Dom Paes</text>

  <text x="600" y="205" text-anchor="middle" fill="#484f58"
        font-family="Consolas,Menlo,Monaco,Courier New,monospace"
        font-size="22" letter-spacing="8">NICK</text>

  <rect width="1200" height="300" fill="url(#sheen)" mask="url(#maskName)"/>
  <rect width="1200" height="300" fill="url(#sheen2)" mask="url(#maskNick)"/>

  <rect x="0" y="297" width="260" height="3" fill="#8b949e" opacity="0.9">
    <animate attributeName="x" values="-260;1200" dur="6.5s" repeatCount="indefinite"/>
  </rect>

  <g fill="#6e7681">
    <rect x="596" y="232" width="8" height="14">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
